[package]
name = "rust-sandbox"
version = "0.1.0"
authors = ["criyle <gaoyang4425@gmail.com>"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
nix = { version = "0.31", features = ["socket", "uio", "resource", "fs", "term", "zerocopy", "sched", "process"] }
tokio = { version = "=1.54.1", features = ["full"] }
libc = "0.2"
prost = "0.14"
base64 = "0.22"
seccompiler = { version = "0.5", features = ["json"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
http-body = "1"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tokio-stream = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.29"
object = { version = "0.40", default-features = false, features = ["read", "elf"] }
rustc-demangle = "0.1"
rpprof = { version = "=0.18.3", default-features = false, features = ["framehop-unwinder", "prost-codec"] }
flate2 = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
criterion = "0.5"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_pointer_width = "64")'.dependencies]
tokio = { version = "=1.54.1", features = ["schedule-latency"] }

[[bench]]
name = "sandbox"
harness = false

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
