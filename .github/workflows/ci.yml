name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets
      - name: Compile
        run: cargo check --locked --all-targets
      - name: Unit tests
        if: matrix.toolchain == 'stable'
        run: |
          mapfile -t namespace_test_skips < .github/namespace-test-skips.txt
          test_args=()
          for filter in "${namespace_test_skips[@]}"; do
            test_args+=(--skip "$filter")
          done
          cargo test --locked --lib --bins -- "${test_args[@]}"
      - name: Verify package contents
        if: matrix.toolchain == 'stable'
        run: cargo package --locked --no-verify
